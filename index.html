<style>
@font-face{font-family:"PixKR";src:url("fonts/Galmuri11-Bold.woff2") format("woff2");font-display:block}
/* Layout: phone column — pixel-art stage on top, two chunky thumb buttons, then share and setup panels.
   Palette: PICO-8 style 16 colors. Type: Galmuri11 Bold for anything "in the game", system Korean sans for long help text.
   Single night-arcade look by choice. */
:root{
  color-scheme:dark;
  --ink:#000000; --bg:#0d0f1e; --navy:#1d2b53; --deep:#141a33; --edge:#2c3a6b;
  --plum:#7e2553; --red:#ff004d; --orange:#ffa300; --yellow:#ffec27; --blue:#29adff; --lime:#00e436;
  --white:#fff1e8; --lgray:#c2c3c7; --lav:#83769c; --dgray:#5f574f;
  --f-pix:"PixKR","Apple SD Gothic Neo","Malgun Gothic",monospace;
  --f-body:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--white);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:6px 6px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.pix{font-family:var(--f-pix);font-weight:400;letter-spacing:0;-webkit-font-smoothing:none;font-smooth:never}

/* stage */
.stage{position:relative;width:100%;height:min(64vh,580px);height:min(64dvh,580px);min-height:420px;background:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--edge),0 6px 0 3px var(--ink);display:grid;place-items:center;overflow:hidden}
canvas#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hud .sc{font-family:var(--f-pix);font-size:24px;line-height:1;color:var(--white);text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink)}
.hud .lives{font-family:var(--f-pix);font-size:24px;line-height:1.2;color:var(--red);text-shadow:2px 2px 0 var(--ink)}
.hud .r{text-align:right;font-family:var(--f-pix);font-size:12px;line-height:1.4;color:var(--lgray);text-shadow:1px 1px 0 var(--ink)}
.pop{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-pix);font-size:24px;color:var(--yellow);pointer-events:none;opacity:0;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),3px 3px 0 var(--red)}
.pop.show{animation:pop .8s steps(6) forwards}
@keyframes pop{0%{opacity:1;transform:scale(.5)}20%{opacity:1;transform:scale(1.2)}35%{transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
.ctl{position:absolute;right:8px;top:46px;display:flex;gap:6px}
.ctl button{font-family:var(--f-pix);font-size:12px;background:var(--deep);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);padding:5px 8px;color:var(--lgray)}

/* overlays inside stage */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:18px 16px;
  background:linear-gradient(to top,rgba(13,15,30,.97) 55%,rgba(13,15,30,.35))}
.ov .tag{font-family:var(--f-pix);font-size:12px;color:var(--yellow)}
.ov h1{font-family:var(--f-pix);font-weight:400;font-size:48px;line-height:1.05;margin:0;color:var(--white);
  text-shadow:3px 3px 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),6px 6px 0 var(--plum)}
.ov h1 span{color:var(--red)}
.ov p{color:#dfe0ea}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;align-items:start}
.keys b{font-family:var(--f-pix);font-weight:400;font-size:12px;padding:2px 6px;border:2px solid var(--ink)}
.keys .s{background:var(--red);color:var(--white)} .keys .g{background:var(--blue);color:var(--navy)}
.big{font-family:var(--f-pix);font-size:48px;line-height:1;color:var(--yellow);text-shadow:3px 3px 0 var(--ink)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.facts div{background:var(--deep);border:2px solid var(--ink);padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.facts .v{font-family:var(--f-pix);font-size:12px;color:var(--white)}
.facts .l{font-size:11px;color:var(--lav)}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.tally span{font-family:var(--f-pix);font-size:12px;padding:3px 7px;background:var(--plum);border:2px solid var(--ink)}

/* buttons */
.btn{font-family:var(--f-pix);font-size:12px;background:var(--red);color:var(--white);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),0 4px 0 var(--ink);padding:12px 10px;text-align:center;transition:transform .05s}
.btn.big2{font-size:24px;padding:12px 10px 14px}
.btn.alt{background:var(--navy);color:var(--white)}
.btn.gold{background:var(--yellow);color:var(--navy)}
.btn:active{transform:translateY(4px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.28)}
.row{display:flex;gap:8px}.row>*{flex:1 1 0;min-width:0}
.pad{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding-top:4px}
.pad button{height:88px;font-family:var(--f-pix);font-size:24px;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.25),0 6px 0 var(--ink);transition:transform .05s}
.pad button small{font-size:12px;opacity:.85}
.pad .g{background:var(--blue);color:var(--navy)}
.pad .s{background:var(--red);color:var(--white)}
.pad button.on{transform:translateY(6px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.25)}
.pad .g.cool{filter:grayscale(.8) brightness(.7)}
.note{font-size:12px;color:var(--lav)}
.toast{font-family:var(--f-pix);font-size:12px;color:var(--yellow);min-height:16px}

/* panels */
.panel{background:var(--deep);border:3px solid var(--ink);box-shadow:0 0 0 2px var(--edge);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-pix);font-weight:400;font-size:24px;margin:0;color:var(--yellow);text-shadow:2px 2px 0 var(--ink)}
.lab{font-family:var(--f-pix);font-size:12px;color:var(--lgray)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-pix);font-size:12px;padding:6px 9px;background:var(--navy);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.chip.on{background:var(--red)}
.chip.mine{background:var(--yellow);color:var(--navy)}
.face-row{display:flex;gap:12px;align-items:center}
.face-prev{flex:none;width:72px;height:72px;background:var(--navy);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-pix);font-size:24px;color:var(--lav)}
.face-prev canvas{width:72px;height:72px;image-rendering:pixelated}
.fcol{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.sbtn{display:inline-block;font-family:var(--f-pix);font-size:12px;padding:8px 10px;background:var(--navy);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.link{font-family:var(--f-pix);font-size:12px;color:var(--lav);text-decoration:underline}
#crop{display:flex;flex-direction:column;gap:10px;align-items:center}
#cropC{width:min(260px,100%);aspect-ratio:1;touch-action:none;cursor:grab;background:var(--ink);border:3px solid var(--ink)}
#zoom{width:min(260px,100%);accent-color:var(--red)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;font-family:var(--f-pix);font-size:16px;padding:10px;border:2px solid var(--ink);background:var(--bg);color:var(--white);border-radius:0}
.addrow button{flex:none}
.cardimg{width:100%;image-rendering:pixelated;border:3px solid var(--ink);display:block;aspect-ratio:1080/1352;background:var(--navy)}
.chk{display:flex;gap:8px;align-items:center;font-family:var(--f-pix);font-size:12px}
.chk input{width:18px;height:18px;accent-color:var(--red)}
details.info{border-top:2px dashed var(--edge);padding-top:10px}
details.info summary{cursor:pointer;font-family:var(--f-pix);font-size:12px;color:var(--lgray)}
details.info .body{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#cfd0dc;padding-top:8px}
details.info h3{font-family:var(--f-pix);font-weight:400;font-size:12px;margin:4px 0 0;color:var(--yellow)}
.danger{background:var(--plum)}
.vsbox{background:var(--plum);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--red);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.vsbox b{font-weight:400;color:var(--yellow)}
.ov .addrow input{font-size:16px}
@media (prefers-reduced-motion:reduce){.pop.show{animation-duration:.01s}.btn,.pad button{transition:none}}
</style>
</head>
<body>


<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud" hidden><span><span class="sc" id="sc">0</span><br><span class="lives" id="lives"></span></span><span class="r"><span id="lvl">1번째 건물</span><br><span id="best"></span></span></div>
    <div class="pop" id="pop"></div>
    <div class="ctl" id="ctl" hidden><button id="bPause">일시정지</button><button id="bMute"></button></div>
    <div class="ov" id="ov"></div>
  </div>
  <div class="pad">
    <button class="g" id="bGuard" aria-label="막기">막기<small>튕겨 내기</small></button>
    <button class="s" id="bSlash" aria-label="베기">베기<small>점프하며 베기</small></button>
  </div>
  <p class="note" style="text-align:center">키보드: 베기 Space / ↑ · 막기 ↓ · 일시정지 P</p>
  <div class="panel" id="sharePanel" hidden></div>
  <div class="panel" id="setup"></div>
</div>

<script>
/* =========================================================
   배포할 때 채워 넣을 값
   ========================================================= */
const SHARE_URL="https://ockddak.github.io/building-slash/";   // 예: "https://building-slash.netlify.app"
const CONTACT="";     // 예: "myemail@example.com"
const VERSION="데모 0.4";
const GC_CODE="";     // GoatCounter 사이트 코드 (예: "buildingslash"). 비어 있으면 집계하지 않아요.

/* ---------- 방문자 집계 (GoatCounter: 쿠키 없이 방문 수와 버튼 사용 횟수만 셈) ---------- */
function track(name){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:"event/"+name,title:name,event:true})}catch(e){}}
if(GC_CODE&&/^https?:$/.test(location.protocol)&&window.top===window){
  const sc=document.createElement("script");sc.async=true;sc.dataset.goatcounter=`https://${GC_CODE}.goatcounter.com/count`;sc.src="https://gc.zgo.at/count.js";
  sc.onload=()=>{if(location.hash.includes("vs."))track("challenge-opened")};document.head.appendChild(sc);
}

/* =========================================================
   게임 데이터
   ========================================================= */
const W=360, FH=42, BWID=270, BX=(W-BWID)/2, PH=72, REACH=36, GROUND=72;
let H=600, GY=528;
const TYPES=[
  {n:"한옥",hp:1,k:"hanok"},{n:"빌라",hp:2,k:"villa"},{n:"아파트",hp:2,k:"apt"},
  {n:"오피스텔",hp:3,k:"office"},{n:"고층 빌딩",hp:3,k:"tower"},
];
const BOSS={n:"보스",hp:5,k:"boss"};
const BOSS_WORDS=["월요일","마감","대출이자","보고서","야근"];
const STRESS={
  teen:["시험","수행평가","학원","숙제","잔소리","중간고사","기말고사","생기부"],
  twenty:["자소서","면접","월세","학자금","알바","서류 탈락","토익","취업"],
  adult:["야근","월요일","대출이자","관리비","회의","보고서","출근길","카드값"],
};
const GEN=[["all","전부 섞기"],["teen","10대"],["twenty","20대"],["adult","30·40대"]];
const MAXW=7;
const LIVES=3, LATE_G=35;  // 목숨 수, 8번째 건물 이후 건물마다 더해지는 낙하 가속 (봇 측정으로 정한 값)
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pickA=a=>a[Math.floor(Math.random()*a.length)];
/* 같은 씨앗 번호면 누구에게나 같은 건물 순서가 나와요 (친구 도전장용) */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let GR=Math.random;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* =========================================================
   이 기기에만 저장
   ========================================================= */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let best=+lsGet("bs_best")||0;
let gen=lsGet("bs_gen")||"all";if(!GEN.some(g=>g[0]===gen))gen="all";
let mine=[];try{mine=(JSON.parse(lsGet("bs_mine"))||[]).filter(w=>typeof w==="string").map(w=>w.slice(0,MAXW)).slice(0,5)}catch(e){}
let faceURL=null,faceImg=null;
function setFace(url){faceURL=url;faceImg=null;lsSet("bs_face",url);SKIN.setFace(null);
  if(url){const im=new Image();im.onload=()=>{faceImg=im;SKIN.setFace(im);renderFacePrev()};im.src=url}}
function pickStress(){
  const r1=GR(),r2=GR(); // 항상 두 번만 뽑아서, 내 스트레스가 있어도 건물 순서가 달라지지 않게
  if(!(S&&S.ch)&&mine.length&&r1<.4)return{w:mine[Math.floor(r2*mine.length)],own:true};
  const g=S?S.gen:gen,list=g==="all"?[...STRESS.teen,...STRESS.twenty,...STRESS.adult]:STRESS[g];
  return{w:list[Math.floor(r2*list.length)],own:false};
}
/* ---------- 친구 도전장 코드 ---------- */
const GENKEYS=GEN.map(g=>g[0]);
const b64e=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=t=>{try{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return decodeURIComponent(escape(atob(t)))}catch(e){return""}};
function makeCode(seed,score,g,name){return["vs",(seed>>>0).toString(36),Math.max(0,score|0).toString(36),Math.max(0,GENKEYS.indexOf(g)),name?b64e(name.slice(0,8)):""].join(".")}
function parseCode(str){
  const m=String(str||"").match(/vs\.([0-9a-z]{1,8})\.([0-9a-z]{1,6})\.(\d)\.?([A-Za-z0-9_-]{0,40})/);if(!m)return null;
  const seed=parseInt(m[1],36),score=parseInt(m[2],36);if(!seed||!isFinite(score))return null;
  return{seed,score,gen:GENKEYS[+m[3]]||"all",name:b64d(m[4]).replace(/[<>"&]/g,"").slice(0,8)};
}
const BASE=SHARE_URL||(/^https?:$/.test(location.protocol)&&window.top===window?location.origin+location.pathname:"");
let CH=parseCode(location.hash);
let myName=(lsGet("bs_name")||"").slice(0,8);

/* =========================================================
   효과음 (파일 없이 합성)
   ========================================================= */
let AC=null,muted=lsGet("bs_mute")==="1";
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==="suspended")AC.resume().catch(()=>{});return AC}
function tone(f,d,type,v,slide,delay=0){const a=au();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v){const a=au();if(!a)return;const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=buf;f.type="lowpass";f.frequency.value=900;g.gain.value=v;src.connect(f);f.connect(g);g.connect(a.destination);src.start()}
function sfx(k){if(muted)return;try{
  if(k==="whoosh")tone(1000,.06,"square",.025,-600);
  if(k==="hit")tone(220,.06,"square",.05,-90);
  if(k==="break"){noise(.2,.25);tone(110,.16,"square",.05,-50)}
  if(k==="guard")tone(440,.12,"square",.05,330);
  if(k==="clear")[523,659,784,1046].forEach((f,i)=>tone(f,.12,"square",.04,0,i*.08));
  if(k==="die"){noise(.45,.3);tone(220,.55,"square",.07,-180)}
  if(k==="hurt"){noise(.22,.28);tone(200,.25,"square",.06,-110)}
}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* =========================================================
   게임 규칙 — 그리기와 분리되어 있어요. 스킨을 바꿔도 이 부분은 그대로예요.
   ========================================================= */
let S=null;
function newBuilding(level){
  if(level%5===0){
    const floors=Array.from({length:3},()=>({t:BOSS,hp:5,max:5,shake:0,seed:Math.random(),w:BOSS_WORDS[Math.floor(GR()*BOSS_WORDS.length)],own:false}));
    return{floors,by:GY+60,vb:0,g:200+level*30,x:BX,boss:true};
  }
  if(S&&S.tut&&level===1){
    const floors=Array.from({length:3},()=>({t:TYPES[0],hp:1,max:1,shake:0,seed:Math.random(),...pickStress()}));
    return{floors,by:GY+60,vb:0,g:150,x:BX};
  }
  const n=Math.min(12,3+Math.floor(level*0.8));
  const tIdx=Math.min(TYPES.length-1,Math.floor((level-1)/2));

  <form class="addrow" id="addF"><input id="addI" maxlength="${MAXW}" placeholder="예: 보고서 수정" autocomplete="off" aria-label="내 스트레스"><button class="sbtn" type="submit">추가</button></form>
  ${mine.length?`<div class="chips">${mine.map((w,i)=>`<button class="chip mine" data-rm="${i}" aria-label="${esc(w)} 지우기">${esc(w)} ×</button>`).join("")}</div>`:""}
  <details class="info"><summary>게임 정보 · 개인정보 안내</summary><div class="body">
    <p>빌딩 베기 ${VERSION}</p>

    <p>2004년 플래시 게임 '키루비루(건물부수기)'의 떨어지는 건물을 베는 조작 방식에서 영감을 받아 새로 만들었어요.</p>

  renderFacePrev();
  $("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>openCrop(im);im.src=r.result};r.readAsDataURL(f)};
  if($("rmFace"))$("rmFace").onclick=()=>{setFace(null);renderSetup()};
  el.querySelectorAll("[data-gen]").forEach(b=>b.onclick=()=>{gen=b.dataset.gen;lsSet("bs_gen",gen);renderSetup()});
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{mine.splice(+b.dataset.rm,1);lsSet("bs_mine",JSON.stringify(mine));renderSetup()});
  $("addF").onsubmit=e=>{e.preventDefault();const w=$("addI").value.trim().slice(0,MAXW);if(!w||mine.includes(w)||mine.length>=5)return;mine.push(w);lsSet("bs_mine",JSON.stringify(mine));renderSetup()};
  $("wipe").onclick=e=>{const b=e.currentTarget;if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="한 번 더 누르면 모두 지워져요";return}
    ["bs_best","bs_face","bs_mine","bs_gen","bs_tut","bs_mute"].forEach(k=>lsSet(k,null));best=0;mine=[];gen="all";muted=false;setFace(null);renderSetup()};
}
function openCrop(img){
  const base=Math.max(440/img.width,440/img.height);
  CROP={img,base,z:1,ox:(440-img.width*base)/2,oy:(440-img.height*base)/2};
  $("crop").hidden=false;$("zoom").value=1;drawCrop();
  const cc=$("cropC");let drag=null;
  cc.onpointerdown=e=>{cc.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY}};
  cc.onpointermove=e=>{if(!drag)return;const k=440/cc.getBoundingClientRect().width;CROP.ox+=(e.clientX-drag.x)*k;CROP.oy+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};drawCrop()};
  cc.onpointerup=cc.onpointercancel=()=>drag=null;
  $("zoom").oninput=e=>{const nz=+e.target.value,r=nz/CROP.z;CROP.ox=220-(220-CROP.ox)*r;CROP.oy=220-(220-CROP.oy)*r;CROP.z=nz;drawCrop()};
  $("cropNo").onclick=()=>{CROP=null;$("crop").hidden=true};
  $("cropOk").onclick=()=>{
    const out=document.createElement("canvas");out.width=out.height=128;const o=out.getContext("2d");
    const s=CROP.base*CROP.z,k=128/400;
    o.beginPath();o.arc(64,64,64,0,Math.PI*2);o.clip();
    o.drawImage(CROP.img,(CROP.ox-20)*k,(CROP.oy-20)*k,CROP.img.width*s*k,CROP.img.height*s*k);
    setFace(out.toDataURL("image/png"));CROP=null;renderSetup();track("face-set");
  };
}
function drawCrop(){
  const g=$("cropC").getContext("2d"),s=CROP.base*CROP.z;
  g.clearRect(0,0,440,440);g.drawImage(CROP.img,CROP.ox,CROP.oy,CROP.img.width*s,CROP.img.height*s);
  g.fillStyle="rgba(0,0,0,.6)";g.beginPath();g.rect(0,0,440,440);g.arc(220,220,200,0,Math.PI*2,true);g.fill("evenodd");
  g.strokeStyle="#ffec27";g.lineWidth=4;g.beginPath();g.arc(220,220,200,0,Math.PI*2);g.stroke();
}

/* ---------- 입력 ---------- */
function bind(el,fn){el.addEventListener("pointerdown",e=>{e.preventDefault();el.classList.add("on");fn()});["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,()=>el.classList.remove("on")))}
bind($("bSlash"),slash);bind($("bGuard"),guard);
addEventListener("keydown",e=>{if(e.repeat||(e.target.closest&&e.target.closest("input,textarea")))return;
  if(["Space","ArrowUp","KeyZ"].includes(e.code)){e.preventDefault();if(S&&S.paused)resume();else if(S&&S.mode==="play")slash();else if(!$("ov").hidden&&S&&(S.mode==="title"||S.mode==="over"))start()}
  if(["ArrowDown","KeyX"].includes(e.code)){e.preventDefault();guard()}
  if(["Escape","KeyP"].includes(e.code)){if(S&&S.paused)resume();else pause()}});

/* ---------- 시작 ---------- */
{const f=lsGet("bs_face");if(f&&f.startsWith("data:image/"))setFace(f)}
addEventListener("hashchange",()=>{const c=parseCode(location.hash);if(c&&S&&(S.mode==="title"||S.mode==="over")){CH=c;showStart()}});
layout();showStart();requestAnimationFrame(loop);
</script>
